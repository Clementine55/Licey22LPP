<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал печати Лицея</title>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="flex hidden">
        <div class="login-box">
            <h2>Печать документов</h2>
            <div class="input-group"><input type="email" id="email" placeholder="Логин или Email" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="Пароль" required></div>
            <button class="primary" onclick="UI.handleLogin()">Войти</button>
            <p id="login-error" class="hidden" style="color: var(--danger); font-size: 14px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="app-screen" class="flex hidden">
        <div class="sidebar">
            <div>
                <div class="sidebar-header">Ваши библиотеки</div>
                <div class="library-list" id="libraries"></div>
            </div>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="UI.handleLogout()">
                    <span style="font-size: 18px;">🚪</span> Выйти из системы
                </button>
            </div>
        </div>
        <div class="main-content">
            <div class="header">
                <h3 id="current-path" style="margin: 0;">Выберите библиотеку слева</h3>
                
                <div class="user-profile hidden" id="user-profile">
                    <div class="user-name" id="user-name">Загрузка...</div>
                    <div class="user-avatar" id="user-avatar">👤</div>
                </div>
            </div>
            <div class="file-browser" id="file-list">
                <p style="color: var(--text-muted);">Здесь появятся ваши документы.</p>
            </div>
        </div>
    </div>

    <!-- ОКНО ПЕЧАТИ -->
    <div class="modal-overlay hidden" id="print-modal">
        <div class="modal">
            <div class="modal-preview">
                <div class="preview-loading" id="preview-loading">
                    <div class="spinner"></div>
                    <p>Рендеринг документа...</p>
                </div>
                <iframe id="preview-iframe" class="hidden"></iframe>
            </div>

            <div class="modal-sidebar">
                <div class="modal-header">
                    <h3>Печать</h3>
                    <button class="modal-close" onclick="UI.closePrintModal()">✖</button>
                </div>
                
                <div class="modal-body">
                    <p style="margin-top:0; font-size: 13px; color: var(--text-muted); word-break: break-all;" id="modal-filename"></p>

                    <div class="input-group">
                        <label>Принтер</label>
                        <select id="printer-select" onchange="UI.checkPrinterStatus()">
                            <option value="Lexmark_Servernaya">Lexmark MS312dn</option>
                        </select>
                        <div id="printer-status" style="font-size: 12px; margin-top: 5px; color: var(--text-muted);">Проверка статуса...</div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label>Копии</label>
                            <input type="number" id="print-copies" value="1" min="1" max="50">
                        </div>
                        <div class="input-group">
                            <label>Страницы</label>
                            <input type="text" id="print-pages" placeholder="Все (напр: 1-3)" onchange="UI.refreshPreview()">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label>Тип бумаги</label>
                            <select id="print-paper-size" onchange="UI.refreshPreview()">
                                <option value="a4">A4 (Стандарт)</option>
                                <option value="a3">A3</option>
                                <option value="letter">Letter</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Двусторонняя печать</label>
                            <select id="print-duplex">
                                <option value="none">Нет</option>
                                <option value="two-sided-long-edge">По длинному краю</option>
                                <option value="two-sided-short-edge">По короткому краю</option>
                            </select>
                        </div>
                    </div>

                    <div id="excel-settings">
                        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 0;">Настройки для таблиц:</p>
                        
                        <div class="input-group">
                            <label>Ориентация</label>
                            <select id="print-orientation" onchange="UI.refreshPreview()">
                                <option value="landscape">Альбомная</option>
                                <option value="portrait">Книжная</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Поля</label>
                            <select id="print-margins" onchange="UI.refreshPreview()">
                                <option value="normal">Обычные (Top 0.75", Left 0.7")</option>
                                <option value="narrow">Узкие (0.25")</option>
                                <option value="wide">Широкие (1")</option>
                                <option value="none">Без полей</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Масштаб</label>
                            <select id="print-scale-mode" onchange="UI.toggleCustomScale(); UI.refreshPreview()">
                                <option value="fit">Вместить на страницу (Авто)</option>
                                <option value="100">Реальный размер (100%)</option>
                                <option value="custom">Настраиваемый (%)</option>
                            </select>
                            <input type="number" id="print-scale-custom" value="100" min="10" max="200" class="hidden" style="margin-top:8px;" onchange="UI.refreshPreview()">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="primary btn-success" id="btn-submit-print" onclick="API.submitPrintJob()">🖨️ Отправить на печать</button>
                    <p id="print-status" class="hidden"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="success-modal" style="z-index: 2000;">
        <div class="success-box">
            <div class="success-icon">✅</div>
            <h3>Успешно!</h3>
            <p>Документ отправлен в очередь печати.</p>
            <button class="primary btn-success" onclick="UI.closeSuccessModal()">Отлично</button>
        </div>
    </div>

    <script src="/static/js/state.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
